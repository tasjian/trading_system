# Docker Compose for Local Testing of LLM-Enhanced Trading System
version: '3.8'

services:
  trading-system:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: development
        APP_VERSION: 1.0.0
    
    container_name: llm-trading-system
    
    ports:
      - "8080:8080"
    
    environment:
      # Core application settings
      - TRADING_MODE=paper
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8080
      
      # Trading parameters
      - MAX_PORTFOLIO_RISK=0.05
      - MAX_POSITION_SIZE=0.15
      - STOP_LOSS_PERCENT=0.08
      - REBALANCE_FREQUENCY=3600
      - MIN_REBALANCE_THRESHOLD=0.05
      - MIN_CASH_RESERVE=0.1
      
      # Risk management
      - MAX_DAILY_TRADES=10
      - MAX_DAILY_LOSS=0.05
      
      # LLM settings
      - LLM_TEMPERATURE=0.7
      - LLM_MAX_TOKENS=2000
      
      # Alpaca configuration (paper trading)
      - ALPACA_BASE_URL=https://paper-api.alpaca.markets/v2
      
      # API Keys (set these in your .env file or environment)
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Optional data source API keys
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
    
    volumes:
      # Persistent storage for logs
      - ./logs:/app/logs
      - ./data:/app/data
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge

volumes:
  logs:
    driver: local
  data:
    driver: local